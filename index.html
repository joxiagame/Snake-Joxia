<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE MASTER PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --theme-color: #39ff14; --theme-rgb: 57,255,20; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif; transition: background .6s ease; color: #fff;
            overflow: hidden; touch-action: none; background: #05070b;
        }
        /* Calque d'ambiance anime (motif signature par theme, teinte a la couleur du serpent) */
        #bg { position: fixed; inset: 0; z-index: 0; display: block; }
        /* Vignette pour la profondeur et le contraste */
        body::after {
            content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(circle at 50% 42%, transparent 52%, rgba(0,0,0,.62));
        }

        .user-bar {
            position: fixed; top: 18px; right: 18px; z-index: 1000;
            background: rgba(12,14,20,.7); backdrop-filter: blur(10px);
            padding: 8px 10px 8px 18px; border-radius: 50px;
            border: 1px solid rgba(var(--theme-rgb), .5);
            box-shadow: 0 0 20px rgba(var(--theme-rgb), .25);
            display: flex; align-items: center; gap: 12px; font-size: 14px;
        }
        .user-bar b { color: var(--theme-color); font-weight: 700; }
        .exit-btn {
            background: rgba(255,68,68,.15); border: 1px solid #ff4444;
            color: #ff6b6b; padding: 6px 14px; border-radius: 20px; cursor: pointer;
            font-size: 11px; font-weight: 700; letter-spacing: 1px; transition: .2s;
        }
        .exit-btn:hover { background: #ff4444; color: #fff; }

        /* Fonds "Synth Arcade" : degrade sombre teinte + halo haut (le canvas #bg ajoute le motif anime par-dessus) */
        body.theme-city   { --theme-color: #00d4ff; --theme-rgb: 0,212,255;   background: radial-gradient(1100px 760px at 50% -12%, rgba(0,212,255,.16), transparent 60%), linear-gradient(180deg, #061019 0%, #04070f 55%, #020409 100%); }
        body.theme-horror { --theme-color: #b45cff; --theme-rgb: 180,92,255;  background: radial-gradient(1000px 720px at 50% -12%, rgba(180,92,255,.16), transparent 60%), linear-gradient(180deg, #150a1e 0%, #0c0614 55%, #060309 100%); }
        body.theme-sea    { --theme-color: #29b6f6; --theme-rgb: 41,182,246;  background: radial-gradient(1100px 800px at 50% -14%, rgba(41,182,246,.18), transparent 62%), linear-gradient(180deg, #072033 0%, #05131f 55%, #02080f 100%); }
        body.theme-brainrot { --theme-color: #c0ff00; --theme-rgb: 192,255,0; background: radial-gradient(1000px 720px at 50% -12%, rgba(192,255,0,.14), transparent 58%), linear-gradient(180deg, #12180a 0%, #0b1004 55%, #050702 100%); }
        body.theme-sakura { --theme-color: #ff80ab; --theme-rgb: 255,128,171; background: radial-gradient(1000px 760px at 50% -12%, rgba(255,128,171,.18), transparent 60%), linear-gradient(180deg, #241322 0%, #170b16 55%, #0b050a 100%); }
        body.theme-cyber  { --theme-color: #39ff14; --theme-rgb: 57,255,20;   background: radial-gradient(1000px 720px at 50% -12%, rgba(57,255,20,.15), transparent 58%), linear-gradient(180deg, #08160a 0%, #050d06 55%, #020602 100%); }

        #wrapper {
            position: relative; z-index: 2;
            background: rgba(10,12,18,.8); backdrop-filter: blur(16px);
            padding: 30px; border-radius: 24px; text-align: center; width: 460px; max-width: 94vw;
            border: 1px solid rgba(var(--theme-rgb), .45);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 20px 60px rgba(0,0,0,.7), 0 0 50px rgba(var(--theme-rgb), .18);
        }

        h1 {
            font-family: 'Orbitron', sans-serif; color: var(--theme-color);
            text-transform: uppercase; letter-spacing: 3px; font-weight: 900;
            margin: 6px 0 18px; text-shadow: 0 0 18px rgba(var(--theme-rgb), .6);
        }

        select {
            font-family: 'Orbitron', sans-serif; padding: 13px; margin: 8px 0; width: 88%;
            border-radius: 12px; border: 1px solid rgba(var(--theme-rgb), .5);
            background: rgba(0,0,0,.55); color: #fff; text-align: center; font-size: 14px; cursor: pointer; outline: none;
        }

        button {
            font-family: 'Orbitron', sans-serif; background: var(--theme-color); color: #05070a;
            padding: 14px 26px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; margin: 8px; font-size: 13px;
            box-shadow: 0 6px 18px rgba(var(--theme-rgb), .35);
            transition: transform .15s, box-shadow .2s, filter .2s;
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 10px 26px rgba(var(--theme-rgb), .55); }
        button:active { transform: translateY(0); }

        /* Boutons secondaires (contour) */
        #leaderBtn, #backBtn, #menuBtn {
            background: transparent; color: var(--theme-color);
            border: 1px solid rgba(var(--theme-rgb), .6); box-shadow: none;
        }
        #leaderBtn:hover, #backBtn:hover, #menuBtn:hover { background: rgba(var(--theme-rgb), .12); box-shadow: 0 0 20px rgba(var(--theme-rgb), .3); }

        .toggle-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 14px 0; font-size: 12px; letter-spacing: 1px; color: #cdd3dd; }
        #touchToggle { padding: 8px 20px; font-size: 12px; background: transparent; color: var(--theme-color); border: 1px solid var(--theme-color); box-shadow: none; }

        /* HUD en jeu */
        .hud { display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron', sans-serif; margin-bottom: 12px; gap: 10px; }
        .hud-name { color: var(--theme-color); font-weight: 700; font-size: 13px; letter-spacing: 1px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hud-score { font-size: 13px; letter-spacing: 1px; color: #cdd3dd; }
        .hud-score b { color: var(--theme-color); font-size: 18px; margin-left: 4px; }
        #pauseBtn { background: transparent; color: var(--theme-color); border: 1px solid rgba(var(--theme-rgb), .6); padding: 8px 18px; font-size: 11px; box-shadow: none; margin: 0; }
        #pauseBtn.active { background: var(--theme-color); color: #05070a; }

        #touch-ui { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 190px; margin: 16px auto 4px; }
        .t-btn {
            width: 58px; height: 58px; background: rgba(255,255,255,.06);
            border: 1px solid rgba(var(--theme-rgb), .5); border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            color: var(--theme-color); cursor: pointer; user-select: none; transition: .15s;
        }
        .t-btn:active { background: rgba(var(--theme-rgb), .25); }

        canvas {
            background: #06070a; border: 1px solid rgba(var(--theme-rgb), .5);
            border-radius: 14px; display: block; margin: 4px auto 0; max-width: 100%;
            box-shadow: 0 0 30px rgba(var(--theme-rgb), .2), inset 0 0 40px rgba(0,0,0,.6);
        }

        /* --- Écran Game Over --- */
        #gameover { animation: goIn 0.35s ease-out; }
        @keyframes goIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        .go-title { font-family: 'Orbitron', sans-serif; color: #ff4b5c; text-shadow: 0 0 22px rgba(255,75,92,.7); font-size: 38px; margin-bottom: 6px; }
        .go-stats { margin: 18px 0; }
        .go-line { font-family: 'Orbitron', sans-serif; color: #8b93a3; letter-spacing: 4px; font-size: 12px; }
        .go-score { font-family: 'Orbitron', sans-serif; color: var(--theme-color); font-size: 62px; font-weight: 900; text-shadow: 0 0 24px rgba(var(--theme-rgb), .7); line-height: 1.1; }
        .go-best { color: #e6e9ef; margin-top: 8px; font-size: 15px; }
        .go-best b { color: var(--theme-color); }
        .go-new { font-family: 'Orbitron', sans-serif; color: #ffd54a; font-weight: 900; margin-top: 12px; letter-spacing: 1px; animation: blink 0.8s ease-in-out infinite alternate; }
        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }

        /* --- Classement --- */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { font-family: 'Orbitron', sans-serif; color: var(--theme-color); border-bottom: 1px solid rgba(var(--theme-rgb), .4); padding: 10px; letter-spacing: 1px; font-size: 12px; }
        td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.06); }
        tr td:first-child { text-align: left; }
        tr td:last-child { text-align: right; font-weight: 700; color: var(--theme-color); }
        tr.me { background: rgba(var(--theme-rgb), .12); }
        tr.me td { color: #fff; }
        .rank { display: inline-block; width: 22px; color: #8b93a3; font-weight: 700; }
        .lb-empty { color: #8b93a3; padding: 20px; font-style: italic; text-align: center !important; }
    </style>
</head>
<body class="theme-city">

                <option value="city">🏙️ VILLE</option>
                <option value="horror">🎃 MANOIR</option>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const urlParams = new URLSearchParams(window.location.search);
        const user = urlParams.get('player') || "Invité";
        document.getElementById('topNavUser').innerText = user;

        const firebaseConfig = {
            apiKey: "AIzaSyAMsHTUhHFNjXZO9dp7k_LWsjPKK-8s3ps",
            authDomain: "joxiahub-2928b.firebaseapp.com",
            projectId: "joxiahub-2928b",
            storageBucket: "joxiahub-2928b.appspot.com",
            messagingSenderId: "1078726336822",
            appId: "1:1078726336822:web:f425c178ca58ff63e99397",
            databaseURL: "https://joxiahub-2928b-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);
        const DB_PATH = 'games/Snake/scores';

        /* ================= Décor d'ambiance animé (Synth Arcade) ================= */
        const bg = document.getElementById('bg');
        const bgx = bg.getContext('2d');
        let bgW = 0, bgH = 0, bgDpr = 1, bgTheme = 'city', bgParticles = [], bgT = 0, bgLast = performance.now();

        const BG = {
            city:     { motif: 'grid',    rgb: [0, 212, 255],   n: 0 },
            cyber:    { motif: 'rain',    rgb: [57, 255, 20],   n: 90 },
            sea:      { motif: 'bubbles', rgb: [41, 182, 246],  n: 46 },
            sakura:   { motif: 'petals',  rgb: [255, 128, 171], n: 40 },
            horror:   { motif: 'fog',     rgb: [180, 92, 255],  n: 16 },
            brainrot: { motif: 'orbs',    rgb: [192, 255, 0],   n: 60 }
        };

        const rand = (a, b) => a + Math.random() * (b - a);

        function bgResize() {
            bgDpr = Math.min(window.devicePixelRatio || 1, 2);
            bgW = window.innerWidth; bgH = window.innerHeight;
            bg.width = bgW * bgDpr; bg.height = bgH * bgDpr;
            bg.style.width = bgW + 'px'; bg.style.height = bgH + 'px';
            bgx.setTransform(bgDpr, 0, 0, bgDpr, 0, 0);
        }
        window.addEventListener('resize', () => { bgResize(); bgInit(bgTheme); });

        function bgSpawn(motif, initial) {
            const p = {};
            switch (motif) {
                case 'rain':
                    p.x = rand(0, bgW); p.y = initial ? rand(0, bgH) : -rand(20, 200);
                    p.len = rand(12, 40); p.spd = rand(220, 520); p.a = rand(.15, .6); break;
                case 'bubbles':
                    p.x = rand(0, bgW); p.y = initial ? rand(0, bgH) : bgH + rand(0, 60);
                    p.r = rand(2, 7); p.spd = rand(20, 70); p.drift = rand(-16, 16); p.ph = rand(0, 6.28); p.a = rand(.15, .45); break;
                case 'petals':
                    p.x = rand(0, bgW); p.y = initial ? rand(0, bgH) : -rand(10, 120);
                    p.r = rand(4, 9); p.spd = rand(30, 70); p.sway = rand(20, 60); p.ph = rand(0, 6.28); p.rot = rand(0, 6.28); p.vr = rand(-1.5, 1.5); p.a = rand(.25, .6); break;
                case 'fog':
                    p.x = rand(0, bgW); p.y = rand(bgH * .1, bgH * .9);
                    p.r = rand(120, 300); p.vx = rand(-12, 12); p.vy = rand(-6, 6); p.a = rand(.04, .1); break;
                case 'orbs': default:
                    p.x = rand(0, bgW); p.y = rand(0, bgH);
                    p.r = rand(1.5, 5); p.vx = rand(-20, 20); p.vy = rand(-20, 20); p.a = rand(.2, .6); break;
            }
            return p;
        }

        function bgInit(theme) {
            const cfg = BG[theme] || BG.city;
            bgParticles = [];
            for (let i = 0; i < cfg.n; i++) bgParticles.push(bgSpawn(cfg.motif, true));
        }

        function setBgTheme(theme) { if (theme !== bgTheme || !bgParticles) { bgTheme = theme; bgInit(theme); } }

        function bgOrb(x, y, rad, r, g, b, a) {
            const gg = bgx.createRadialGradient(x, y, 0, x, y, rad * 3);
            gg.addColorStop(0, `rgba(${r},${g},${b},${a})`);
            gg.addColorStop(1, `rgba(${r},${g},${b},0)`);
            bgx.fillStyle = gg; bgx.beginPath(); bgx.arc(x, y, rad * 3, 0, 6.2832); bgx.fill();
            bgx.fillStyle = `rgba(${r},${g},${b},${Math.min(a + .2, .9)})`;
            bgx.beginPath(); bgx.arc(x, y, rad, 0, 6.2832); bgx.fill();
        }
        function bgPetal(x, y, rad, rot, r, g, b, a) {
            bgx.save(); bgx.translate(x, y); bgx.rotate(rot);
            bgx.fillStyle = `rgba(${r},${g},${b},${a})`;
            bgx.beginPath(); bgx.ellipse(0, 0, rad, rad * .55, 0, 0, 6.2832); bgx.fill();
            bgx.restore();
        }
        function bgDrawGrid(r, g, b) {
            const horizon = bgH * 0.42, vpX = bgW / 2;
            bgx.strokeStyle = `rgba(${r},${g},${b},0.16)`; bgx.lineWidth = 1;
            const cnt = 22, speed = 0.16, frac = (bgT * speed) % 1;
            for (let i = 0; i < cnt; i++) {
                const f = (i + frac) / cnt;
                const yy = horizon + (bgH - horizon) * (f * f);
                bgx.globalAlpha = Math.min(f * 1.8, 1);
                bgx.beginPath(); bgx.moveTo(0, yy); bgx.lineTo(bgW, yy); bgx.stroke();
            }
            bgx.globalAlpha = 1;
            const vcnt = 26;
            for (let i = 0; i <= vcnt; i++) {
                const t = i / vcnt, xBottom = t * bgW * 2 - bgW * 0.5;
                bgx.beginPath(); bgx.moveTo(vpX, horizon); bgx.lineTo(xBottom, bgH); bgx.stroke();
            }
            bgx.strokeStyle = `rgba(${r},${g},${b},0.5)`; bgx.lineWidth = 2;
            bgx.beginPath(); bgx.moveTo(0, horizon); bgx.lineTo(bgW, horizon); bgx.stroke();
        }

        function bgLoop(now) {
            const dt = Math.min((now - bgLast) / 1000, 0.05); bgLast = now; bgT += dt;
            const cfg = BG[bgTheme] || BG.city;
            const [r, g, b] = cfg.rgb;
            bgx.clearRect(0, 0, bgW, bgH);

            if (cfg.motif === 'grid') bgDrawGrid(r, g, b);

            for (const p of bgParticles) {
                switch (cfg.motif) {
                    case 'rain':
                        p.y += p.spd * dt;
                        bgx.strokeStyle = `rgba(${r},${g},${b},${p.a})`; bgx.lineWidth = 1.5;
                        bgx.beginPath(); bgx.moveTo(p.x, p.y); bgx.lineTo(p.x, p.y - p.len); bgx.stroke();
                        if (p.y - p.len > bgH) Object.assign(p, bgSpawn('rain', false));
                        break;
                    case 'bubbles':
                        p.y -= p.spd * dt; p.x += Math.sin(bgT + p.ph) * p.drift * dt;
                        bgOrb(p.x, p.y, p.r, r, g, b, p.a);
                        if (p.y + p.r < 0) Object.assign(p, bgSpawn('bubbles', false));
                        break;
                    case 'petals':
                        p.y += p.spd * dt; p.x += Math.sin(bgT * .8 + p.ph) * p.sway * dt; p.rot += p.vr * dt;
                        bgPetal(p.x, p.y, p.r, p.rot, r, g, b, p.a);
                        if (p.y - p.r > bgH) Object.assign(p, bgSpawn('petals', false));
                        break;
                    case 'fog': {
                        p.x += p.vx * dt; p.y += p.vy * dt;
                        if (p.x < -p.r) p.x = bgW + p.r; if (p.x > bgW + p.r) p.x = -p.r;
                        if (p.y < -p.r) p.y = bgH + p.r; if (p.y > bgH + p.r) p.y = -p.r;
                        const fg = bgx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
                        fg.addColorStop(0, `rgba(${r},${g},${b},${p.a})`); fg.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        bgx.fillStyle = fg; bgx.beginPath(); bgx.arc(p.x, p.y, p.r, 0, 6.2832); bgx.fill();
                        break;
                    }
                    case 'orbs': default:
                        p.x += p.vx * dt; p.y += p.vy * dt;
                        if (p.x < 0) p.x = bgW; if (p.x > bgW) p.x = 0;
                        if (p.y < 0) p.y = bgH; if (p.y > bgH) p.y = 0;
                        bgOrb(p.x, p.y, p.r, r, g, b, p.a);
                        break;
                }
            }
            requestAnimationFrame(bgLoop);
        }

        bgResize(); bgInit(bgTheme); requestAnimationFrame(bgLoop);

        const canvas = document.getElementById("snakeGame"); const ctx = canvas.getContext("2d");
        const box = 20; let snake, food, d, score, gameLoop, th;
        let isTouchEnabled = false, isPaused = false, isCountingDown = false, countdownValue = 3, canChangeDir = true;
        let isInMenu = true;

        function getThemeBaseColor(theme) {
            const colors = {
                city: "#00d4ff", horror: "#b45cff", sea: "#29b6f6",
                sakura: "#ff80ab", brainrot: "#c0ff00", cyber: "#39ff14"
            };
            return colors[theme] || "#39ff14";
        }

        function hexToRgba(hex, a) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r},${g},${b},${a})`;
        }

        // Assombrit une couleur hex vers la queue (t: 0 = tête vive, 1 = queue sombre)
        function shadeColor(hex, t) {
            const h = hex.replace('#', '');
            const f = 1 - t * 0.6;
            const r = Math.round(parseInt(h.substring(0, 2), 16) * f);
            const g = Math.round(parseInt(h.substring(2, 4), 16) * f);
            const b = Math.round(parseInt(h.substring(4, 6), 16) * f);
            return `rgb(${r},${g},${b})`;
        }

        // Plateau : fond sombre dégradé + grille néon subtile + vignette
        function drawBoard(theme) {
            const baseColor = getThemeBaseColor(theme);
            const bg = ctx.createRadialGradient(200, 200, 30, 200, 200, 300);
            bg.addColorStop(0, "#14161d");
            bg.addColorStop(1, "#07080b");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, 400, 400);

            ctx.strokeStyle = hexToRgba(baseColor, 0.09);
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 1; i < 20; i++) {
                ctx.moveTo(i * box + 0.5, 0); ctx.lineTo(i * box + 0.5, 400);
                ctx.moveTo(0, i * box + 0.5); ctx.lineTo(400, i * box + 0.5);
            }
            ctx.stroke();

            const vg = ctx.createRadialGradient(200, 200, 120, 200, 200, 290);
            vg.addColorStop(0, "rgba(0,0,0,0)");
            vg.addColorStop(1, "rgba(0,0,0,.55)");
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, 400, 400);
        }

        function drawSnake(snake, theme) {
            if (!snake || !snake.length) return;
            const baseColor = getThemeBaseColor(theme);
            const center = (s) => ({ x: s.x + box / 2, y: s.y + box / 2 });
            const n = snake.length;

            ctx.save();
            ctx.lineJoin = "round";
            ctx.lineCap = "round";

            const width = box * 0.9;

            // Trace le corps comme une polyligne continue passant par le centre de chaque case
            const tracePath = () => {
                ctx.beginPath();
                ctx.moveTo(center(snake[0]).x, center(snake[0]).y);
                for (let i = 1; i < n; i++) ctx.lineTo(center(snake[i]).x, center(snake[i]).y);
            };

            if (n === 1) {
                const c = center(snake[0]);
                ctx.shadowBlur = 0;
                ctx.fillStyle = (theme === 'brainrot') ? 'hsl(0,85%,60%)' : baseColor;
                ctx.beginPath(); ctx.arc(c.x, c.y, width / 2, 0, Math.PI * 2); ctx.fill();
            } else if (theme === 'brainrot') {
                // thème fun : corps arc-en-ciel continu (dégradé de teinte fluide)
                ctx.shadowBlur = 0;
                ctx.lineWidth = width;
                for (let i = n - 1; i > 0; i--) {
                    const a = center(snake[i]), b = center(snake[i - 1]);
                    ctx.strokeStyle = `hsl(${(i * 18) % 360}, 85%, 60%)`;
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                }
            } else {
                // 1) glow ambiant en UNE seule passe (pas d'anneaux)
                ctx.save();
                ctx.strokeStyle = baseColor;
                ctx.lineWidth = width;
                ctx.shadowColor = baseColor;
                ctx.shadowBlur = 16;
                tracePath(); ctx.stroke();
                ctx.restore();

                // 2) corps par-dessus avec dégradé continu tête->queue (sans glow -> transition lisse)
                ctx.shadowBlur = 0;
                ctx.lineWidth = width;
                for (let i = n - 1; i > 0; i--) {
                    const t = i / (n - 1);          // 0 tête (vive) -> 1 queue (sombre)
                    const a = center(snake[i]), b = center(snake[i - 1]);
                    ctx.strokeStyle = shadeColor(baseColor, t);
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                }
            }

            // --- Tête : petits yeux mignons façon Google Snake ---
            const h = center(snake[0]);
            const dv = { LEFT: [-1, 0], RIGHT: [1, 0], UP: [0, -1], DOWN: [0, 1] }[d] || [1, 0];
            const pv = [-dv[1], dv[0]];
            const eyeFwd = 2.5, eyeSide = 4.3, eyeR = 3.4, pupR = 1.8;
            [1, -1].forEach(sgn => {
                const ex = h.x + dv[0] * eyeFwd + pv[0] * eyeSide * sgn;
                const ey = h.y + dv[1] * eyeFwd + pv[1] * eyeSide * sgn;
                ctx.fillStyle = "#fff";
                ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#1a1a1a";
                ctx.beginPath(); ctx.arc(ex + dv[0] * 1.1, ey + dv[1] * 1.1, pupR, 0, Math.PI * 2); ctx.fill();
            });

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        function drawFood(food, theme) {
            const icon = foodIcons[theme];
            const centerX = food.x + box / 2;
            const centerY = food.y + box / 2;
            const baseColor = getThemeBaseColor(theme);
            // Pulsation "respirante" basée sur le temps
            const pulse = 1 + Math.sin(performance.now() / 200) * 0.15;
            ctx.save();
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.shadowBlur = 18 * pulse;
            ctx.shadowColor = baseColor;
            ctx.beginPath();
            ctx.arc(centerX, centerY, (box / 1.8) * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            ctx.font = `${(box - 2) * pulse}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(icon, centerX, centerY + 1);
        }

        const foodIcons = { city: "🏙️", horror: "🕯️", sea: "🌴", sakura: "🌸", brainrot: "🍎", cyber: "🍏" };

        function updateUI() {
            const v = document.getElementById("themeSelect").value;
            document.body.className = "theme-" + v;
            setBgTheme(v);
            const names = { city: 'VILLE', horror: 'MANOIR', sea: 'PLAGE', sakura: 'SAKURA', brainrot: 'BRAINROT', cyber: 'CYBER' };
            document.getElementById("title").innerText = "SNAKE " + names[v];
        }
        document.getElementById("themeSelect").addEventListener('change', updateUI);

        function toggleTouch() {
            isTouchEnabled = !isTouchEnabled;
            const btn = document.getElementById("touchToggle");
            btn.innerText = isTouchEnabled ? "ON" : "OFF";
            btn.style.background = isTouchEnabled ? "var(--theme-color)" : "transparent";
            btn.style.color = isTouchEnabled ? "#05070a" : "var(--theme-color)";
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }
        document.getElementById("touchToggle").onclick = toggleTouch;

        function setDir(newD) {
            if(isPaused || isCountingDown || !canChangeDir) return;
            if(newD === "LEFT" && d !== "RIGHT") { d = "LEFT"; canChangeDir = false; }
            if(newD === "UP" && d !== "DOWN") { d = "UP"; canChangeDir = false; }
            if(newD === "RIGHT" && d !== "LEFT") { d = "RIGHT"; canChangeDir = false; }
            if(newD === "DOWN" && d !== "UP") { d = "DOWN"; canChangeDir = false; }
        }

        document.getElementById("btnUP").onclick = () => setDir("UP");
        document.getElementById("btnDOWN").onclick = () => setDir("DOWN");
        document.getElementById("btnLEFT").onclick = () => setDir("LEFT");
        document.getElementById("btnRIGHT").onclick = () => setDir("RIGHT");

        function togglePause() {
            if(isCountingDown) return;
            if(!isPaused) { isPaused = true; document.getElementById("pauseBtn").innerText = "REPRENDRE"; document.getElementById("pauseBtn").classList.add('active'); }
            else startCountdown();
        }
        document.getElementById("pauseBtn").onclick = togglePause;

        function startCountdown() {
            isPaused = false; isCountingDown = true; countdownValue = 3;
            document.getElementById("pauseBtn").innerText = "PRÊT ?";
            let timer = setInterval(() => {
                countdownValue--;
                if(countdownValue <= 0) { clearInterval(timer); isCountingDown = false; document.getElementById("pauseBtn").innerText = "PAUSE"; document.getElementById("pauseBtn").classList.remove('active'); }
            }, 1000);
        }

        function checkAndStart() {
            isInMenu = false;
            th = document.getElementById("themeSelect").value;
            setBgTheme(th);
            document.getElementById("menu").style.display="none"; 
            document.getElementById("game").style.display="block";
            document.getElementById("pDisplay").innerText = user;
            if(isTouchEnabled) document.getElementById("touch-ui").style.display = "grid";
            start();
        }
        document.getElementById("startBtn").onclick = checkAndStart;

        let isPlaying = false, rafId = null;

        function start() {
            snake = [{x: 10*box, y: 10*box}, {x: 9*box, y: 10*box}];
            score = 0; d = "RIGHT"; isPaused = false; isCountingDown = false; canChangeDir = true;
            document.getElementById("scoreVal").innerText = "0";
            food = { x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box };
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(step, 100);
            // Boucle de rendu fluide (60 fps) découplée de la logique
            isPlaying = true;
            if(rafId) cancelAnimationFrame(rafId);
            renderLoop();
        }

        // --- RENDU (visuel uniquement, ~60 fps) ---
        function renderLoop() {
            if(!isPlaying) return;
            render();
            rafId = requestAnimationFrame(renderLoop);
        }

        function render() {
            drawBoard(th);
            drawSnake(snake, th);
            drawFood(food, th);

            if(isPaused || isCountingDown) {
                ctx.fillStyle = "rgba(4,6,10,0.72)"; ctx.fillRect(0,0,400,400);
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                const col = getThemeBaseColor(th);
                ctx.save();
                ctx.shadowColor = col; ctx.shadowBlur = 24;
                ctx.fillStyle = col;
                ctx.font = isPaused ? "700 40px Orbitron, sans-serif" : "900 90px Orbitron, sans-serif";
                ctx.fillText(isPaused ? "PAUSE" : countdownValue, 200, 200);
                ctx.restore();
                if (isPaused) {
                    ctx.fillStyle = "rgba(255,255,255,.6)";
                    ctx.font = "500 13px Orbitron, sans-serif";
                    ctx.fillText("ESPACE POUR REPRENDRE", 200, 250);
                }
                ctx.textBaseline = "alphabetic";
            }
        }

        // --- LOGIQUE (déplacement, 10 pas/s) ---
        function step() {
            if(isPaused || isCountingDown) return;

            canChangeDir = true;
            let sX = snake[0].x, sY = snake[0].y;
            if(d==="LEFT") sX -= box; if(d==="UP") sY -= box; if(d==="RIGHT") sX += box; if(d==="DOWN") sY += box;

            if (d) {
                // CORRECTION DÉFINITIVE BORDURES : sX strict 0-400
                if (sX < 0 || sX >= 400 || sY < 0 || sY >= 400 || snake.some(s => s.x === sX && s.y === sY)) {
                    clearInterval(gameLoop);
                    isPlaying = false;
                    saveScore(user, score).then(() => showGameOver(score));
                    return;
                }
                if(sX === food.x && sY === food.y) {
                    score++; document.getElementById("scoreVal").innerText = score;
                    food = { x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box };
                } else {
                    snake.pop();
                }
                snake.unshift({x:sX, y:sY});
            }
        }

        async function saveScore(name, newScore) {
            if(name === "Invité") return; 
            const snap = await get(ref(db, DB_PATH));
            let key = null, oldS = 0;
            if (snap.exists()) {
                const data = snap.val();
                for (let k in data) { 
                    if (data[k].name.toLowerCase() === name.toLowerCase()) { 
                        key = k; oldS = data[k].score; break; 
                    } 
                }
            }
            if (!key) push(ref(db, DB_PATH), { name: name, score: newScore });
            else if (newScore > oldS) set(ref(db, `${DB_PATH}/${key}`), { name: name, score: newScore });
        }

        function showGameOver(finalScore) {
            const prevBest = +(localStorage.getItem('snakeBest') || 0);
            const best = Math.max(finalScore, prevBest);
            localStorage.setItem('snakeBest', best);
            document.getElementById("finalScore").innerText = finalScore;
            document.getElementById("bestScore").innerText = best;
            document.getElementById("newRecord").style.display =
                (finalScore > prevBest && finalScore > 0) ? "block" : "none";
            document.getElementById("game").style.display = "none";
            const go = document.getElementById("gameover");
            go.style.display = "block";
            // relance l'animation d'apparition à chaque game over
            go.style.animation = "none"; void go.offsetWidth; go.style.animation = "";
        }

        function replay() {
            document.getElementById("gameover").style.display = "none";
            document.getElementById("game").style.display = "block";
            start();
        }
        document.getElementById("replayBtn").onclick = replay;

        function backToMenu() {
            isInMenu = true;
            isPlaying = false;
            if(rafId) cancelAnimationFrame(rafId);
            document.getElementById("gameover").style.display = "none";
            document.getElementById("leaderboard").style.display = "none";
            document.getElementById("game").style.display = "none";
            document.getElementById("menu").style.display = "block";
        }
        document.getElementById("backBtn").onclick = backToMenu;
        document.getElementById("menuBtn").onclick = backToMenu;

        document.getElementById("leaderBtn").onclick = () => {
            isInMenu = false;
            document.getElementById("menu").style.display = "none";
            document.getElementById("leaderboard").style.display = "block";
            onValue(query(ref(db, DB_PATH), orderByChild('score'), limitToLast(10)), (s) => {
                const val = s.val();
                const list = val ? Object.values(val).sort((a,b) => b.score - a.score) : [];
                const medals = ["🥇", "🥈", "🥉"];
                document.getElementById("lBody").innerHTML = list.length
                    ? list.map((e, i) => {
                        const rank = medals[i] || `<span class="rank">${i + 1}</span>`;
                        const me = e.name.toLowerCase() === user.toLowerCase() ? ' class="me"' : '';
                        return `<tr${me}><td>${rank} ${escapeHtml(e.name)}</td><td>${e.score}</td></tr>`;
                    }).join('')
                    : `<tr><td colspan="2" class="lb-empty">Aucun score pour l'instant</td></tr>`;
            });
        };

        document.addEventListener("keydown", e => {
            const goVisible = document.getElementById("gameover").style.display === "block";
            if (e.code === "Space") {
                if (goVisible) replay();
                else if (isInMenu) checkAndStart();
                else if (isPlaying) togglePause();
            }
            if(e.key.includes("Arrow")) setDir(e.key.replace("Arrow","").toUpperCase());
        });
    </script>
</body>
</html>
